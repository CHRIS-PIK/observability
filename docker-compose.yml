services:
  loki:
    image: grafana/loki:3.5.5
    container_name: olympus-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${DATA_ROOT:-./data}/loki:/loki
    networks:
      - monitoring
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.8.1
    container_name: olympus-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=public-preview
    ports:
      - "${ALLOY_UI_PORT:-12345}:12345"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "${ALLOY_PROFILE_PORT:-4041}:4041"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    depends_on:
      - loki
      - mimir
      - tempo
      - pyroscope
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    container_name: olympus-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${DATA_ROOT:-./data}/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - frontend
      - monitoring
    depends_on:
      - loki
      - mimir
      - tempo
      - pyroscope
    restart: unless-stopped

  mimir:
    image: grafana/mimir:3.1.2
    container_name: olympus-mimir
    command: ["-config.file=/etc/mimir/mimir-config.yml"]
    ports:
      - "${MIMIR_PORT:-9009}:9009"
    volumes:
      - ./config/mimir/mimir-config.yml:/etc/mimir/mimir-config.yml:ro
      - ${DATA_ROOT:-./data}/mimir:/mimir
    networks:
      - monitoring
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.0
    container_name: olympus-tempo
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./config/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - ${DATA_ROOT:-./data}/tempo:/var/tempo
    networks:
      - monitoring
    restart: unless-stopped

  pyroscope:
    image: grafana/pyroscope:1.14.1
    container_name: olympus-pyroscope
    command:
      - "-config.file=/etc/pyroscope/config.yaml"
    ports:
      - "${PYROSCOPE_PORT:-4040}:4040"
    volumes:
      - ./config/pyroscope/config.yaml:/etc/pyroscope/config.yaml:ro
      - ${DATA_ROOT:-./data}/pyroscope:/var/lib/pyroscope
    networks:
      - monitoring
    restart: unless-stopped

networks:
  frontend:
    external: true
    name: ${FRONTEND_NETWORK:-frontend}
  monitoring:
    external: true
    name: ${MONITORING_NETWORK:-monitoring}
